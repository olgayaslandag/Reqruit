<svg
  width="140"
  height="64"
  viewBox="0 0 340 64"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Bilan Logo"
>

  <!-- Icon -->
  <g transform="translate(20,8)">
    <!-- Outer diamond -->
    <polygon
      points="24,0 48,24 24,48 0,24"
      fill="none"
      stroke="#0A6DD9"
      stroke-width="3"
    />
    <!-- Inner diamond -->
    <polygon
      points="24,10 38,24 24,38 10,24"
      fill="#0A6DD9"
    />
  </g>

  <!-- Text -->
  <text
    x="92"
    y="42"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="32"
    font-weight="600"
    fill="#000"
    letter-spacing="0.5"
  >
    Bilan
  </text>
</svg>
